<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Croy Lingo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one calm column. Lesson heat strip on top, three practice modes below, drill screens replace the home view. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface2:#e9eef2; --ink:#18212b; --ink2:#54606d; --line:#d2dae2;
  --accent:#2f3f9e; --accent-ink:#ffffff;
  --new:#8995a2; --weak:#d4601f; --strong:#157587; --learned:#7a3fa8;
  --ok-bg:#e3f2f4; --bad-bg:#fbebe2;
  --serif:'Gentium Plus','Gentium Book Plus','Noto Serif','Times New Roman',serif;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --surface:#19212a; --surface2:#222c37; --ink:#e8edf2; --ink2:#9ba8b5; --line:#2f3a46;
    --accent:#9aa8ff; --accent-ink:#0d1221;
    --new:#76828f; --weak:#f08a55; --strong:#4dbfd1; --learned:#c79bff;
    --ok-bg:#16323a; --bad-bg:#3a2619; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --surface2:#222c37; --ink:#e8edf2; --ink2:#9ba8b5; --line:#2f3a46;
  --accent:#9aa8ff; --accent-ink:#0d1221;
  --new:#76828f; --weak:#f08a55; --strong:#4dbfd1; --learned:#c79bff;
  --ok-bg:#16323a; --bad-bg:#3a2619; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:30px}
h2{font-size:21px}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grk{font-family:var(--serif)}
.wordsrow{display:flex;flex-direction:column;gap:6px;min-width:260px;flex:1 1 300px;font-size:14px;color:var(--ink2)}
.wordsrow .lbl{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
.wordsrow .lbl b{color:var(--ink)}
.rs{position:relative;height:62px;max-width:420px;margin:2px 11px 0}
.rs-segs{position:absolute;left:0;right:0;top:14px;height:12px;display:flex;gap:3px}
.rs-seg{flex:1;background:var(--line);border-radius:3px;opacity:.7}
.rs-seg.on{opacity:1}
.rs-seg.on.n{background:var(--new)}.rs-seg.on.w{background:var(--weak)}.rs-seg.on.s{background:var(--strong)}.rs-seg.on.l{background:var(--learned)}
.rs input[type=range]{position:absolute;left:-11px;top:4px;width:calc(100% + 22px);margin:0;height:32px;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rs input[type=range]::-webkit-slider-runnable-track{background:none;height:32px}
.rs input[type=range]::-moz-range-track{background:none;height:32px}
.rs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:12px;height:32px;border-radius:5px;background:var(--surface);border:3px solid var(--accent);cursor:grab;box-sizing:border-box}
.rs input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:32px;border-radius:5px;background:var(--surface);border:3px solid var(--accent);cursor:grab;box-sizing:border-box}
.rs-ticks{position:absolute;left:0;right:0;top:40px;display:flex;gap:3px;font-size:12px;color:var(--ink2)}
.rs-ticks span{flex:1;text-align:center}
/* practice types get lighter-to-richer tints as they get harder: flashcards grey, multiple choice orange, matching green, written purple */
:root{--t-flash:#eceff2;--t-mc:#fdeedd;--t-match:#e5f3e6;--t-write:#eee8f8;--tb-flash:#b9c2cb;--tb-mc:#eebb86;--tb-match:#93c796;--tb-write:#b9a4df}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-flash:#262d35;--t-mc:#35291d;--t-match:#1e3022;--t-write:#2b2439;--tb-flash:#56626f;--tb-mc:#8b5a2b;--tb-match:#4a7a4e;--tb-write:#6c58a0}}
:root[data-theme="dark"]{--t-flash:#262d35;--t-mc:#35291d;--t-match:#1e3022;--t-write:#2b2439;--tb-flash:#56626f;--tb-mc:#8b5a2b;--tb-match:#4a7a4e;--tb-write:#6c58a0}
.t-flash{background:var(--t-flash)!important;border-color:var(--tb-flash)!important}
.t-mc{background:var(--t-mc)!important;border-color:var(--tb-mc)!important}
.t-match{background:var(--t-match)!important;border-color:var(--tb-match)!important}
.t-write{background:var(--t-write)!important;border-color:var(--tb-write)!important}
.t-ends{background:var(--t-ends)!important;border-color:var(--tb-ends)!important}
.mode.t-flash,.mode.t-mc,.mode.t-match,.mode.t-ends,.mode.t-write{border-left-width:6px!important}
:root{--t-ends:#e1eef8;--tb-ends:#8fbbe0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-ends:#1d2b38;--tb-ends:#4a7396}}
:root[data-theme="dark"]{--t-ends:#1d2b38;--tb-ends:#4a7396}
.echart{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;margin:4px 0 6px}
.ehead{font-weight:700;font-size:14px;color:var(--ink2);text-align:center}
.erow{font-weight:700;font-size:14px;color:var(--ink2);align-self:center}
.ecell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;min-width:0;padding:6px;border:2px dashed var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);text-align:center;overflow-wrap:anywhere}
.ecell .grk{font-size:20px;line-height:1.2}
.ecell.filled{border-style:solid}
.ecell.target{border-color:var(--accent);border-style:solid}
.ecell.right{background:var(--ok-bg);border:2px solid var(--strong)}
.ecell.wrong{background:var(--bad-bg);border:2px solid var(--weak)}
.ecell:disabled{opacity:1;cursor:default}
.ecell .ph{font-size:12px;margin-top:0}
.ecell .eans{font-size:14px}
.ecell .een{font-size:12px;line-height:1.2}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 4px}
.etile{padding:8px 12px;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-family:var(--serif);font-size:21px;min-height:44px}
.etile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.echart.static .ecell{min-height:0;border-style:solid;border-width:1px}
.etense{display:inline-block;margin:2px 0;padding:3px 14px;border:2px solid var(--accent);border-radius:999px;color:var(--accent);font-weight:700;font-size:19px;line-height:1.3}
@media (max-width:520px){.ecell .grk{font-size:18px}.etile{font-size:19px;padding:8px 10px}}
.modehint{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.ladder{display:inline-flex;gap:3px;margin-left:10px;vertical-align:middle}
.pip{width:14px;height:6px;border-radius:3px;background:var(--line)}
.pip.on.w{background:var(--weak)}.pip.on.s{background:var(--strong)}.pip.on.l{background:var(--learned)}
.ph{display:block;font-size:14px;font-weight:400;font-style:normal;color:var(--ink2);letter-spacing:.02em;margin-top:2px;font-family:var(--sans,inherit)}
.fcard .ph{font-size:16px;margin-top:6px}
.muted{color:var(--ink2)}
.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
header .sub{color:var(--ink2);margin-top:2px}
.savestate{font-size:13px;color:var(--ink2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:5px 11px;font-size:14px}

/* lessons */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.dot.l{background:var(--learned)} .dot.s{background:var(--strong)} .dot.w{background:var(--weak)} .dot.n{background:var(--new)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.chip{--m:0%;text-align:left;display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:var(--radius);
  border:2px solid var(--line);min-width:0;
  background:color-mix(in oklab,color-mix(in oklab,var(--strong) var(--m),var(--weak)) 20%,var(--surface))}
.chip.fresh{background:var(--surface2)}
.chip:not(.on){opacity:.78}
.chip.on{border-color:var(--accent);opacity:1;box-shadow:0 0 0 1px var(--accent) inset}
.chip-top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tick{font-size:14px;color:var(--accent);min-width:14px;text-align:right}
.chip-title{font-size:13px;color:var(--ink2);line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.bar i{display:block;height:100%}
.bar .l{background:var(--learned)} .bar .s{background:var(--strong)} .bar .w{background:var(--weak)} .bar .n{background:var(--new)}
.chip-counts{display:flex;gap:7px;font-size:13px;font-variant-numeric:tabular-nums}
.chip-counts b{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.rangebox select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:34px}
.summary{font-size:15px}
.summary b{font-variant-numeric:tabular-nums}

/* modes */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px}
.mode:hover:not([disabled]){border-color:var(--accent)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode b{font-family:var(--serif);font-size:19px}
.mode span{color:var(--ink2);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;min-height:36px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg.wrap{display:flex;flex-wrap:wrap;gap:6px;border:0;border-radius:0;overflow:visible}
.seg.wrap button{border:1px solid var(--line);border-radius:8px}
.seg.wrap button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.opts{display:flex;gap:22px;flex-wrap:wrap}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink2)}

/* word list */
details.settings{border:1px solid var(--line);border-radius:10px;padding:2px 14px;margin:4px 0 14px;background:var(--surface2)}
details.settings summary{cursor:pointer;font-weight:600;padding:9px 0;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline}
details.settings summary .small{font-weight:400}
details.settings summary{position:relative;padding-right:30px;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
details.settings summary::after{content:"";position:absolute;right:4px;top:50%;width:8px;height:8px;margin-top:-7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .15s}
details.settings[open] summary::after{transform:rotate(-135deg);margin-top:-3px}
@media (prefers-reduced-motion:reduce){details.settings summary::after{transition:none}}
details.settings[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details.settings .opts{padding-bottom:14px}
.lw{margin-left:.3em;white-space:nowrap}.lw .dot{margin-right:.45em;vertical-align:baseline}
details.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 18px}
details.list summary{cursor:pointer;font-weight:600;padding:12px 30px 12px 0;position:relative;list-style:none}
details.list summary::-webkit-details-marker{display:none}
details.list summary::after{content:"";position:absolute;right:4px;top:50%;width:8px;height:8px;margin-top:-7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .15s}
details.list[open] summary::after{transform:rotate(-135deg);margin-top:-3px}
@media (prefers-reduced-motion:reduce){details.list summary::after{transition:none}}
.wl{display:flex;flex-direction:column}
.wl h3{font-size:17px;margin:14px 0 4px}
.wrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) auto;gap:6px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.wrow .g{font-family:var(--serif);font-size:21px;line-height:1.2;overflow-wrap:anywhere}
.wrow .e{overflow-wrap:anywhere}
.wrow{position:relative;padding:9px 10px 9px 14px;border-left:4px solid var(--new);background:color-mix(in srgb,var(--new) 10%,transparent);margin-top:4px;border-radius:6px;border-top:0}
.wrow.w{border-left-color:var(--weak);background:color-mix(in srgb,var(--weak) 14%,transparent)}
.wrow.s{border-left-color:var(--strong);background:color-mix(in srgb,var(--strong) 14%,transparent)}
.wrow.l{border-left-color:var(--learned);background:color-mix(in srgb,var(--learned) 14%,transparent)}
.wrow .wdot{display:none}
.wsort{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.wsort select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 6px;min-height:28px;font-size:13px;color:var(--ink2)}
.wrow .mn{grid-column:1/-1;font-size:13px;color:var(--ink2)}
.wrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;min-height:34px}
.tag{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.reset{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.xfer{margin-top:22px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap}
.xfer button{background:none;border:0;padding:6px 2px;font-size:13px;color:var(--ink2);text-decoration:underline;cursor:pointer}
.xfer button:hover{color:var(--ink)}
.xfer .xmsg{flex-basis:100%}

/* drill */
.topbar{display:flex;align-items:center;gap:14px}
.track{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:0}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;display:flex;flex-direction:column;gap:18px;align-items:stretch}
.prompt{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.prompt .big{font-family:var(--serif);font-size:38px;line-height:1.2;overflow-wrap:anywhere}
.prompt .bigen{font-family:var(--serif);font-size:30px;line-height:1.2;overflow-wrap:anywhere}
.prompt .hint{color:var(--ink2);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-height:62px;min-width:0}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice .n{font-size:13px;color:var(--ink2);border:1px solid var(--line);border-radius:5px;min-width:22px;text-align:center}
.choice .g{font-family:var(--serif);font-size:25px;line-height:1.2;overflow-wrap:anywhere}
.choice.right{background:var(--ok-bg);border-color:var(--strong)}
.choice.wrong{background:var(--bad-bg);border-color:var(--weak)}
.choice[disabled]{cursor:default}
.choice .g.en{font-family:var(--sans);font-size:19px;line-height:1.3}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fside{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.fside .seg button{padding:6px 11px}
.fprog{display:flex;align-items:center;gap:14px;margin:12px 0}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:100%;min-height:280px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;margin-bottom:12px;cursor:pointer}
.fcard:hover{border-color:var(--accent)}
.fcard.back{background:var(--surface2)}
.fcard .big{font-family:var(--serif);font-size:44px;line-height:1.2;overflow-wrap:anywhere}
.fcard .bigen{font-family:var(--serif);font-size:30px;line-height:1.25;overflow-wrap:anywhere}
.fcard .hint{color:var(--ink2);font-size:14px}
.fcard .fm{max-width:34em;font-size:15px;text-align:left}
.fcard.anim{animation:flipin .28s ease-out}
@keyframes flipin{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.fcard.anim{animation:none}}
.answer{display:flex;gap:10px}
.answer input{flex:1;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;font-size:20px}
.answer input:focus{border-color:var(--accent);outline:none}
.fb{border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--ok-bg);border:1px solid var(--strong)}
.fb.no{background:var(--bad-bg);border:1px solid var(--weak)}
.fb.skip{background:var(--surface2);border:1px solid var(--line)}
.fb .verdict{font-weight:700}
.fb .ans{font-size:18px}
.fb .ans .grk{font-size:24px}
.mnem{font-size:15px}
.report{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.report.quiet{align-items:flex-end;margin-top:0}
.report-btn{background:none;border:0;padding:4px 2px;min-height:0;font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.report-btn:hover{color:var(--ink)}
.report input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;font-size:16px;width:100%}
.report textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:16px;width:100%;resize:vertical}
.mnem::before{content:"Remember: ";font-weight:700}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pbtn{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-height:54px;min-width:0;overflow-wrap:anywhere}
.pbtn.g{font-family:var(--serif);font-size:23px;line-height:1.2}
.pbtn:hover:not([disabled]){border-color:var(--accent)}
.pbtn.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pbtn.done{background:var(--ok-bg);border-color:var(--strong);cursor:default}
.pbtn.flash{background:var(--bad-bg);border-color:var(--weak)}
.cm-row{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.cm-row:first-of-type{border-top:0}

<div id="app"><p class="empty" role="status">Loading your vocabulary…</p></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const em  = s => esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>");
const LABEL = {n:"Unlearned", w:"Weak", s:"Strong", l:"Learned"};
const RANK = {n:0, w:1, s:2, l:3};
/* Mastery is one ladder of steps: 0 Unlearned | 1-3 Weak | 4-5 Strong | 6 Learned.
   Every correct answer is +1 step and every miss is -1 step, with these exceptions:
   - multiple choice and matching can only climb as far as the bottom of Strong (4); beyond that only typing counts;
   - a correct typed answer lifts a word below Strong straight to the bottom of Strong (4), then +1 per typed answer up to Learned (6);
   - a miss on a typed answer never takes a word below the bottom of Strong, and does not move a word that is below Strong. */
const TOP = 6, STRONG_AT = 4;
const P_OF = {n:0, w:1, s:4, l:6};
const labelOf = p => p>=TOP ? "l" : p>=STRONG_AT ? "s" : p>=1 ? "w" : "n";
const WEIGHT = {w:5, n:3, s:1, l:0.3};            // how often each status is asked
const $app = document.getElementById("app");
/* ---------- where this copy runs ---------- */
// SITE is true in the GitHub Pages build (tools/build_site.py switches it on); the Claude artifact keeps it false.
const SITE = true;
const SITE_URL = "https://pilotdude.github.io/croy-lingo/";
const ARTIFACT_URL = "https://claude.ai/artifact/EkhixYXAExHFXtFgrhpvW1";
// Banner on the old artifact during and after the move: phase "" (none), "moving" or "frozen"; by = move-by date as text.
const MOVE = {phase:"", by:""};

function clean(raw){ return String(raw||"").replace(/\([^)]*\)/g,"").replace(/\*/g,"").replace(/\s+/g," ").trim(); }
function parts(str){ return String(str).split(/\s*(?:,|\/|…|\.{2,}|;|[!?:]|\.(?=\s|$)|\s[-–—]\s|\bor\b)\s*/i).map(s=>s.trim()).filter(Boolean); }
const STOP = new Set(["the","a","an","to","and","or","of","also","maybe","like"]);
function toks(s){ return norm(s).split(" ").filter(Boolean); }
function content(s){ const t=toks(s), c=t.filter(x=>!STOP.has(x)); return c.length?c:t; }
function tokEq(a,b){ if(a===b) return true; const m=Math.min(a.length,b.length); if(m>=9) return lev2(a,b)<=2; if(m>=6) return lev(a,b)<=1; return false; }
function lev2(a,b){ const m=a.length,n=b.length; const d=[]; for(let i=0;i<=m;i++){d[i]=[i];} for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const hasTok = (list,t)=>list.some(x=>tokEq(x,t));
function norm(s){
  let x = String(s).normalize("NFC").toLowerCase().replace(/[’'`´]/g,"").replace(/[^\p{L}\p{N}\s]/gu," ").replace(/\s+/g," ").trim();
  x = x.replace(/^(?:i|to|the|a|an)\s+/,"");
  return x;
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  const m=a.length,n=b.length; const d=[]; for(let i=0;i<=m;i++){d[i]=[i];} for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- state ---------- */
let cap = {db:null, uid:null, status:"loading", save:"idle", acct:null};   // acct: the site's account (sign in / out); null in the Claude artifact
let lessons = [], W = [], byId = new Map();
let progress = {v:1, w:{}, prefs:{sel:null, n:10, lo:0, hi:3, pair:true, vforms:true}};
let sel = new Set();
let screen = "home", S = null, listOpen = false, setOpen = false, listSort = "lesson", confirmReset = false, rangeFrom = null, rangeTo = null;

function prep(r, n){
  const disp = clean(r.e), vs = new Set();
  parts(disp).forEach(p=>{ const x=norm(p); if(x) vs.add(x); });
  const whole = norm(disp); if(whole) vs.add(whole);
  return {id:r.id, lesson:n, g:r.g, c:r.c||"", gen:r.gen||"", e:disp, p:r.p||"other", m:r.m||"", f:r.f||null, fp:r.fp||null, ph:r.ph||"", vf:r.vf||null, v:vs};
}
function rebuild(){
  W = []; byId = new Map();
  for(const L of lessons) for(const r of (L.words||[])){ const w=prep(r,L.n); W.push(w); byId.set(w.id,w); }
  splitStems();
}
// A tense with a changed stem that the vocab lists as its own word (ἔρχομαι → ἐλεύσομαι, ἦλθον) belongs to that word:
// its forms move there, so they are asked about and mastered on that word, not on the present-tense verb.
function splitStems(){
  const head = new Map();
  for(const w of W) if(w.p==="verb") String(w.g).split("/").forEach(g=>{ g=g.trim(); if(g && !head.has(g)) head.set(g,w); });
  for(const w of W){
    if(!w.vf) continue;
    const to = {};
    w.vf.forEach(f=>{ if(f.pn.split("/").indexOf("1s")<0) return; const h=head.get(f.g); if(h && h!==w) to[f.t]=h; });
    const ts = Object.keys(to); if(!ts.length) continue;
    ts.forEach(t=>{ const h=to[t]; if(!(h.vf||[]).some(f=>f.t===t)) h.vf=(h.vf||[]).concat(w.vf.filter(f=>f.t===t)); });
    w.vf = w.vf.filter(f=>!to[f.t]); if(!w.vf.length) w.vf=null;
  }
}
const st  = id => (progress.w[id] && progress.w[id].s) || "n";
const rec = id => { const r = progress.w[id] || (progress.w[id] = {s:"n",p:0,c:0,x:0,q:2}); if(r.q!==2) fixP(r); return r; };
function fixP(r){                                           // older saved progress used other step numbers: convert once, keeping the label
  const s = r.s || "n", has = typeof r.p==="number";
  r.p = s==="w" ? (has ? Math.max(1, Math.min(3, r.p)) : 1 + Math.min(2, r.k||0))
      : s==="s" ? (has ? (r.p>=5 ? 5 : 4) : STRONG_AT + ((r.z||0)>=1 ? 1 : 0))
      : P_OF[s]||0;
  r.s = labelOf(r.p); r.q = 2; delete r.k; delete r.z;
}
function lstats(n){
  const o={total:0,l:0,s:0,w:0,n:0};
  for(const w of W) if(w.lesson===n){ o.total++; o[st(w.id)]++; }
  return o;
}
function selWords(){ return W.filter(w=>sel.has(w.lesson)); }
const LEVELS = ["Unlearned","Weak","Strong","Learned"];
function rng(){ let lo = Math.max(0, Math.min(3, +progress.prefs.lo||0)), hi = Math.max(0, Math.min(3, progress.prefs.hi===undefined ? 3 : +progress.prefs.hi)); if(lo>hi) lo=hi; return [lo,hi]; }
function inRange(w){ const [lo,hi]=rng(), r=RANK[st(w.id)]; return r>=lo && r<=hi; }
function rangeText(){ const [lo,hi]=rng(); return lo===0&&hi===3 ? "All levels" : lo===hi ? LEVELS[lo]+" only" : LEVELS[lo]+" to "+LEVELS[hi]; }
const TENSE_ORDER = ["pa","pmp","ia","imp","fm"];
function vocabOnly(){ return progress.prefs.vforms===false; }          // "Vocab form only" overrides the tense and person/number focus
function pnOn(){ return !!progress.prefs.pnFocus && !vocabOnly(); }
function tenseSet(){ const t=progress.prefs.tenses; return !vocabOnly() && Array.isArray(t) && t.length ? new Set(t) : null; }
function vOnly(){ return !!(progress.prefs.verbsOnly || pnOn()); }
function formKey(f){ return f ? f.t+"|"+f.pn+"|"+f.g : "vocab"; }
// tenses with at least 4 different person/number forms, limited to the chosen tenses (if any)
function pnTenses(w){
  if(!w.vf) return [];
  const ts=tenseSet(), by={};
  w.vf.forEach(x=>{ if(!ts || ts.has(x.t)) (by[x.t]=by[x.t]||new Set()).add(x.g); });
  return Object.keys(by).filter(t=>by[t].size>=4);
}
function formOK(w){ const x=st(w.id); return x==="s" || x==="l"; }   // only Strong or Learned verbs are ever shown in another form, whatever else is selected
function pnOK(w){ return w.p==="verb" && formOK(w) && pnTenses(w).length>0; }
function pool(){
  let p=selWords().filter(inRange);
  if(pnOn()) p=p.filter(pnOK); else if(progress.prefs.verbsOnly) p=p.filter(w=>w.p==="verb");
  return p;
}
function label(w){ return w.g + (w.c ? " ("+w.c+")" : ""); }

/* ---------- progress engine ---------- */
function record(word, ok, mode){
  const r = rec(word.id), before = r.s;
  if(ok){
    r.c++;
    if(mode==="write") r.p = r.p < STRONG_AT ? STRONG_AT : Math.min(TOP, r.p+1);   // typing: straight to Strong, then one step at a time
    else if(r.p < STRONG_AT) r.p++;                                                // other modes only climb to the bottom of Strong
  }else{
    r.x++;
    if(mode==="write"){ if(r.p > STRONG_AT) r.p--; }       // typing: never below the bottom of Strong, and no change under it
    else if(r.p > 0) r.p--;
  }
  r.s = labelOf(r.p);
  queueSave();
  return {before, after:r.s, p:r.p};
}
function undoRecord(word, snap){ progress.w[word.id] = snap ? Object.assign({},snap) : {s:"n",p:0,c:0,x:0,q:2}; }
function setStatus(id, s){
  const r = rec(id); r.p = P_OF[s]||0; r.s = s; queueSave();
}
function weightedOrder(words){
  return words.map(w=>({w, key:Math.pow(Math.random(), 1/WEIGHT[st(w.id)])})).sort((a,b)=>b.key-a.key).map(o=>o.w);
}

/* ---------- reporting a wrong form ---------- */
let reports = [];
function reportEntry(f, note){
  const w=f.word, base = w.form ? w.base : w.pair ? w.pair.prep : w;
  return {at:new Date().toISOString(), kind: w.form ? "verb form" : w.pair ? "preposition phrase" : "word", id: base.id, shown: w.g,
    label: w.form ? formLabel(w) : (w.pair ? "with "+w.pair.noun.g : ""), expected: w.e, typed: f.typed||"", mode: S ? S.mode : "", note: note||""};
}
let savedName = ""; try{ savedName = localStorage.getItem("croyvocab:name")||""; }catch(e){}
async function sendReport(note){
  const f=S&&S.fb; if(!f) return;
  const entry = reportEntry(f, note);
  reports.push(entry); f.reporting=false; f.reported=true; render();
  if(cap.db && cap.db.inbox){
    const x = Object.assign({}, entry, {kind:"report", where:entry.kind, name:savedName, note:String(entry.note||"")}); delete x.at;
    cap.db.inbox(x).then(()=>{ f.reported="inbox"; render(); }).catch(()=>{});
  }
  if(cap.db && cap.uid){ try{ await cap.db.doc("data/users/"+cap.uid+"/reports").set(JSON.parse(JSON.stringify({v:1, items:reports}))); }catch(e){ f.reported="local"; render(); } }
  else f.reported="local";
}

/* ---------- saving ---------- */
let saveTimer=null, saving=false, dirty=false;
function queueSave(){ dirty=true; if(!cap.db||!cap.uid){ cap.save="local"; return; } cap.save="pending"; clearTimeout(saveTimer); saveTimer=setTimeout(flush,700); paintSave(); }
async function flush(){
  if(!cap.db||!cap.uid||saving||!dirty) return;
  saving=true; dirty=false; cap.save="saving"; paintSave();
  try{
    progress.prefs.sel = Array.from(sel).sort((a,b)=>a-b);
    await cap.db.doc("data/users/"+cap.uid+"/progress").set(JSON.parse(JSON.stringify(progress)));
    cap.save = dirty ? "pending" : "saved";
  }catch(e){ dirty=true; cap.save="error"; }
  finally{ saving=false; paintSave(); if(dirty) { clearTimeout(saveTimer); saveTimer=setTimeout(flush, cap.save==="error"?4000:300); } }
}
function paintSave(){
  const el=document.getElementById("savestate"); if(!el) return;
  el.textContent = ({saved:"Progress saved", saving:"Saving…", pending:"Saving…", error:"Could not save. Retrying.", local:"Progress is not being saved (sign in to keep it)", idle:""})[cap.save]||"";
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden"){ clearTimeout(saveTimer); flush(); } });

/* ---------- grading ---------- */
function grade(input, word){
  const raw = String(input||"").trim(); if(!raw) return {ok:false, empty:true};
  const segs = [raw].concat(parts(raw));
  for(const s of segs){ const n=norm(s); if(n && word.v.has(n)) return {ok:true}; }
  for(const s of segs){ const n=norm(s); if(n.length>=6) for(const v of word.v) if(v.length>=6 && lev(n,v)<=1) return {ok:true, fuzzy:true}; }
  // Looser pass: word order, filler words and a mix of the accepted meanings all count.
  // Every word typed must belong to this word's meanings, and at least one whole meaning must be covered.
  const ci = content(raw), vs = Array.from(word.v), cvs = vs.map(content), U = [].concat(...cvs);
  if(ci.length && ci.every(t=>hasTok(U,t)) && cvs.some(cv=>cv.length && cv.every(t=>hasTok(ci,t)))) return {ok:true, loose:true};
  return {ok:false};
}
const ck = c => c.id + (c.form ? "|"+formKey(c.form) : "");
function conflict(a,b){ for(const v of a.v) if(b.v.has(v)) return true; return false; }

/* ---------- prepositions paired with a noun ---------- */
// A preposition is shown with a noun from the vocabulary in the case it takes ("ἐν τῷ λόγῳ", + dat = "in the word").
const TENSE_LABEL = {pa:"present active", pmp:"present middle/passive", ia:"imperfect active", imp:"imperfect middle/passive", fm:"future middle"};
const PERSON_LABEL = {"1s":"1st person singular","2s":"2nd person singular","3s":"3rd person singular","1p":"1st person plural","2p":"2nd person plural","3p":"3rd person plural"};
function formLabel(w){
  const f=w.form, b=w.pair?null:w.base; if(!f) return "";
  const dep = b && b.vf && !b.vf.some(x=>x.t==="pa" || x.t==="ia") && b.id.indexOf("εἰμί")<0;
  let t = f.tl || TENSE_LABEL[f.t] || f.t; if(dep) t = t.replace("middle/passive","middle (deponent)");
  return (w.sh ? [w.sh.pn] : f.pn.split("/")).map(p=>PERSON_LABEL[p]).join(" or ")+", "+t;
}
// Strong and Learned verbs are shown in other forms that have been taught; Unlearned and Weak verbs always use the vocab form.
function makeForm(w, f){
  const vs = new Set(); (f.a||[]).forEach(x=>{ const n=norm(clean(x)); if(n) vs.add(n); });
  const c = Object.assign({}, w, {g:f.g, e:f.e, ph:f.ph||"", v:vs, form:f, base:w});
  // one spelling can serve two persons (ἔλυον = I was loosing / they were loosing): ask about one, accept either, mention the other on the answer card
  const pns=f.pn.split("/"), es=String(f.e).split(" / ");
  if(pns.length===2 && es.length===2){ const r=Math.random()<0.5?0:1; c.e=es[r]; c.sh={pn:pns[r], opn:pns[1-r], oe:es[1-r]}; }
  return c;
}
function availTenses(){
  const seen={}; W.forEach(w=>(w.vf||[]).forEach(x=>{ if(!seen[x.t]) seen[x.t]=x.tl||TENSE_LABEL[x.t]||x.t; }));
  return TENSE_ORDER.filter(t=>seen[t]).concat(Object.keys(seen).filter(t=>TENSE_ORDER.indexOf(t)<0)).map(t=>({t, name:seen[t]}));
}
// every question a verb could be asked as under the current settings; null stands for the vocab form
function formOptions(w){
  if(!w.vf || !formOK(w)) return [null];
  const ts=tenseSet();
  if(pnOn()){ const ok=new Set(pnTenses(w)); return w.vf.filter(x=>ok.has(x.t)); }
  return [null].concat(w.vf.filter(x=>x.g!==w.g && (!ts || ts.has(x.t))));
}
function formRepeat(w, used){                                     // a different question about a verb already asked in this session
  const opts=formOptions(w); let u=used.get(w.id); if(!u){ u=new Set(); used.set(w.id,u); }
  let fresh=opts.filter(f=>!u.has(formKey(f)));
  if(!fresh.length){ u.clear(); fresh=opts; }
  const f=fresh[Math.floor(Math.random()*fresh.length)];
  u.add(formKey(f)); return f ? makeForm(w,f) : w;
}
function formUp(w){
  const ts=tenseSet(), focus=!!ts || pnOn();
  if(focus){
    if(!w.vf || !formOK(w)) return w;
    const opts=formOptions(w).filter(x=>x);                       // a focused drill asks about forms, whatever the verb's mastery
    if(!opts.length) return w;
    if(!pnOn() && Math.random()<0.2) return w;    // sometimes the vocab form itself
    return makeForm(w, opts[Math.floor(Math.random()*opts.length)]);
  }
  if(progress.prefs.vforms===false || !w.vf) return w;
  const sx = st(w.id); if(sx!=="s" && sx!=="l") return w;
  if(Math.random()<0.4) return w;
  const alts = w.vf.filter(x=>x.g!==w.g); if(!alts.length) return w;
  const own = alts.filter(x=>x.l===w.lesson);                       // forms taught in this verb's own lesson come first
  const wt = x => own.length ? (x.l===w.lesson ? 5 : 1) : 1;
  let tot = alts.reduce((a,x)=>a+wt(x),0), r = Math.random()*tot, pick = alts[0];
  for(const x of alts){ r-=wt(x); if(r<=0){ pick=x; break; } }
  return makeForm(w, pick);
}
function formLike(w, tense){
  if(!formOK(w)) return w;                                            // a verb that isn't Strong yet only ever appears as its vocab form                                          // a form of another verb, used as a wrong answer next to a form
  if(!w.vf) return w;
  const ts=tenseSet(), pool_=ts ? w.vf.filter(x=>ts.has(x.t)) : w.vf;
  const same = pool_.filter(x=>x.t===tense), from = same.length ? same : pool_;
  if(!from.length) return w;                                          // no form in the chosen tenses: its vocab form stands in
  return makeForm(w, shuffle(from)[0]);
}
const nounUse = new Map();
const GRAVE = {"ά":"ὰ","έ":"ὲ","ή":"ὴ","ί":"ὶ","ό":"ὸ","ύ":"ὺ","ώ":"ὼ"};
function pairUp(w){
  if(w.p==="verb") return formUp(w);
  if(!progress.prefs.pair || w.p!=="preposition") return w;
  const cs = (String(w.c).match(/gen|dat|acc/)||[])[0]; if(!cs) return w;
  const all = W.filter(x=>x.p==="noun" && x.f && x.f[cs]);
  const mine = all.filter(x=>sel.has(x.lesson));
  const from = mine.length ? mine : all; if(!from.length) return w;
  const least = Math.min(...from.map(x=>nounUse.get(x.id)||0));
  const n = shuffle(from.filter(x=>(nounUse.get(x.id)||0)===least))[0];
  nounUse.set(n.id, least+1);
  const base = w.g.split(",")[0].trim().replace(/([άέήίόύώ])([ρςνξ]?)$/, (m,a,b)=>GRAVE[a]+b);   // ἀπό → ἀπὸ before another word
  const pe = parts(clean(w.e)), ne = parts(clean(n.e)), vs = new Set();
  for(const p of pe) for(const q of ne){ vs.add(norm(p+" the "+q)); vs.add(norm(p+" "+q)); vs.add(norm(p+" a "+q)); }
  return Object.assign({}, w, {g: base+" "+n.f[cs], ph: ((w.ph||"").split(",")[0].trim()+" "+((n.fp&&n.fp[cs])||"")).trim(), e: pe[0]+" the "+ne[0], v: vs, pair:{prep:w, noun:n}});
}

/* ---------- multiple choice ---------- */
function makeChoices(target, mode){
  const lab = mode==="mce" ? (w=>norm(w.e)) : label;   // English-to-pick mode: never show two choices with the same English
  const strong = st(target.id)==="s" || st(target.id)==="l";
  const want = 3;                                    // every question has 4 choices; strong words just get harder wrong answers
  const inSel = new Set(selWords().map(w=>w.id));
  const vague = w => w.p==="other" || target.p==="other";
  // rank 0 = the kind we want (same part of speech for strong words, different for the rest); 1 = unclassified; 2 = the opposite
  const rank = w => strong ? (w.p===target.p ? 0 : vague(w) ? 1 : 2)
                           : (!vague(w) && w.p!==target.p ? 0 : vague(w) ? 1 : 2);
  const kindOK = w => target.pair ? w.p==="preposition" : target.p==="verb" ? w.p==="verb" : true;   // a preposition phrase or a verb is never the only one of its kind
  const dress = w => target.pair && w.p==="preposition" ? pairUp(w) : target.form && w.p==="verb" ? formLike(w, target.form.t) : w;
  const cand = shuffle(W.filter(w => w.id!==target.id)).map(dress).filter(w => !conflict(w,target) && lab(w)!==lab(target))
    .map(w => ({w, k: (kindOK(w)?0:100) + rank(w)*2 + (inSel.has(w.id)?0:1) + (target.form && w.p==="verb" && !formOK(w.base||w) ? 3 : 0)}))   // a phrase target gets other prepositions (as phrases) as wrong answers, so it doesn't stand out
    .sort((a,b)=>a.k-b.k).map(o=>o.w);
  const picked=[], labels=new Set([lab(target)]);
  const sibs = target.form && target.base.vf ? shuffle(target.base.vf.filter(x=>x.g!==target.g && (!tenseSet() || tenseSet().has(x.t)))
      .sort((a,b)=>(b.t===target.form.t)-(a.t===target.form.t))).map(f=>makeForm(target.base,f)) : [];
  const addSib = k => { for(const w of sibs){ if(k<=0) break;
      if(picked.includes(w) || conflict(w,target) || labels.has(lab(w)) || picked.some(p=>conflict(p,w))) continue;
      picked.push(w); labels.add(lab(w)); k--; } };
  if(pnOn() && target.form){                       // same verb, same tense: only the ending differs
    const same=sibs.filter(w=>w.form.t===target.form.t); sibs.length=0; same.forEach(w=>sibs.push(w)); addSib(want);
  }else if(strong && sibs.length && Math.random()<0.4){          // now and then, other forms of the same verb help show the endings apart
    const tl=target.form.t, near=sibs.filter(w=>w.form.t===tl), rest=sibs.filter(w=>w.form.t!==tl);
    sibs.length=0; near.concat(rest).forEach(w=>sibs.push(w)); addSib(Math.random()<0.5?1:2);
  }
  for(const w of cand){
    if(picked.length>=want) break;
    if(labels.has(lab(w)) || picked.some(p=>conflict(p,w))) continue;
    picked.push(w); labels.add(lab(w));
  }
  return shuffle([target].concat(picked));
}

/* ---------- verb endings chart ---------- */
// Place the six forms of one verb in one tense on a 2 x 3 chart. It does not read or change Mastery.
const PERSONS = ["1s","2s","3s","1p","2p","3p"];
const CHART_ROWS = [["1s","1p"],["2s","2p"],["3s","3p"]];
const ROW_LABEL = ["1st","2nd","3rd"];
const ENDS_CHARTS = 3;
function tenseName(w, f){
  const dep = w.vf && !w.vf.some(x=>x.t==="pa" || x.t==="ia") && w.id.indexOf("εἰμί")<0;
  let t = f.tl || TENSE_LABEL[f.t] || f.t; if(dep) t = t.replace("middle/passive","middle (deponent)"); return t;
}
function endsPairs(){                                            // every (verb, tense) in the selected lessons that has all six persons
  const ts=tenseSet(), out=[];
  for(const w of selWords()){
    if(w.p!=="verb" || !w.vf) continue;
    const by={};
    for(const f of w.vf){
      if(ts && !ts.has(f.t)) continue;
      const pns=f.pn.split("/"), es=String(f.e).split(" / ");
      pns.forEach((p,i)=>{ by[f.t]=by[f.t]||{}; if(!by[f.t][p]) by[f.t][p]={g:f.g, ph:f.ph||"", e: pns.length===es.length ? es[i] : f.e}; });   // a merged spelling (ἔλυον) fills both of its persons
    }
    for(const t of Object.keys(by)) if(PERSONS.every(p=>by[t][p])) out.push({w, t, tn:tenseName(w, w.vf.find(f=>f.t===t)), cells:by[t]});
  }
  return out;
}
function startEnds(fixed){
  const all=endsPairs(); if(!all.length) return;
  let items;
  if(fixed){ items=shuffle(fixed.map(k=>all.find(x=>x.w.id===k.id && x.t===k.t)).filter(Boolean)); if(!items.length) return; }
  else{
    const by=new Map();
    shuffle(all).forEach(x=>{ if(!by.has(x.w.id)) by.set(x.w.id,[]); by.get(x.w.id).push(x); });
    const groups=[...by.values()], limit=ENDS_CHARTS;              // always 3 charts, whatever the Questions setting
    items=[];
    for(let pass=0; items.length<limit; pass++){                   // one chart per verb per pass, so verbs repeat only with a different tense
      let added=false;
      for(const g of shuffle(groups)){ if(items.length>=limit) break; if(g[pass]){ items.push(g[pass]); added=true; } }
      if(!added) break;
    }
  }
  S={mode:"ends", items, idx:0, results:[], fb:null, startedAt:Date.now(), lk:new Map()};
  loadChart(); screen="drill"; render();
}
function loadChart(){
  const it=S.items[S.idx];
  S.cur={tiles:shuffle(PERSONS.map((p,i)=>({id:i, g:it.cells[p].g}))), slots:Object.fromEntries(PERSONS.map(p=>[p,null])), sel:null, checked:false, ok:{}};
}
const tileBy = id => S.cur.tiles.find(t=>t.id===id);                // tiles are shuffled, so look them up by id, not by position
function endsTile(id){ const c=S.cur; if(c.checked) return; c.sel = c.sel===id ? null : id; render(); }
function endsCell(p){
  const c=S.cur; if(c.checked) return;
  if(c.sel!==null){ c.slots[p]=c.sel; c.sel=null; }              // a tile dropped on a full cell sends the old one back to the bank
  else if(c.slots[p]!==null) c.slots[p]=null;                    // tapping a placed tile returns it
  render();
}
function endsClear(){ const c=S.cur; if(c.checked) return; PERSONS.forEach(p=>c.slots[p]=null); c.sel=null; render(); }
function endsCheck(){
  const c=S.cur, it=S.items[S.idx]; if(c.checked) return;
  c.checked=true; c.sel=null; let n=0;
  for(const p of PERSONS){ const tid=c.slots[p]; c.ok[p] = tid!==null && tileBy(tid).g===it.cells[p].g; if(c.ok[p]) n++; }   // identical spellings are interchangeable
  S.results.push({id:it.w.id, t:it.t, tn:it.tn, ok:n===6, n, w:it.w}); render();
}

/* ---------- sessions ---------- */
function startSession(mode, fixed){
  if(mode==="ends"){ startEnds(fixed); return; }
  const words = fixed || pool();
  if(!words.length) return;
  if(mode==="flash"){   // flashcards: every selected word in lesson order, as listed in the vocab, no scoring
    S = {mode, items:words.slice(), idx:0, results:[], fb:null, flipped:false, front:"g", done:false, lk:new Map()};
    screen="drill"; render(); return;
  }
  const n = progress.prefs.n;
  nounUse.clear();
  let items;
  const used = new Map();
  if(!fixed && vOnly() && !vocabOnly() && n && n>words.length){                    // more questions than verbs: ask each verb again, changing the question
    const order=[]; let pass=0;
    while(order.length<n){
      let round=weightedOrder(words).slice(0, n-order.length);
      if(order.length && round.length>1 && round[0].id===order[order.length-1].id) round.push(round.shift());
      round.forEach(w=>order.push(pass===0 ? pairUp(w) : formRepeat(w, used)));
      if(pass===0) order.forEach(w=>{ let u=used.get(w.id); if(!u){ u=new Set(); used.set(w.id,u); } u.add(formKey(w.form)); });
      pass++;
    }
    items=order;
  }else{
    items = fixed ? shuffle(fixed) : (n ? weightedOrder(words).slice(0,n) : weightedOrder(words));
    items = items.map(pairUp);
  }
  S = {mode, items, idx:0, results:[], fb:null, startedAt:Date.now(), lk:new Map(items.map(w=>[w.id,w]))};
  if(mode==="match") setupMatch();
  else if(mode==="mc"||mode==="mce") S.choices = makeChoices(items[0], mode);
  screen = "drill"; render();
}
function pushResult(word, ok, before, after, pass){ S.results.push({id:word.id, ok, before, after, pass:!!pass, w:word}); }

/* matching */
// Every round in a session has the same size (4 to 6). Well-known words get bigger rounds, shaky words smaller ones.
function roundSizes(items){
  const N=items.length; if(N<=6) return [N];
  const know={n:0,w:0.33,s:0.67,l:1};
  const target = 4 + 2 * (items.reduce((a,w)=>a+know[st(w.id)],0)/N);
  let best=null;
  for(const s of [4,5,6]) if(N%s===0){ const d=Math.abs(s-target); if(!best||d<best.d) best={d,sizes:Array(N/s).fill(s)}; }
  if(best) return best.sizes;
  for(let r=Math.ceil(N/6); r<=Math.floor(N/4); r++){            // no exact split: make the rounds as even as possible
    const d=Math.abs(N/r-target);
    if(!best||d<best.d){ const base=Math.floor(N/r), extra=N%r; best={d,sizes:Array.from({length:r},(_,i)=>base+(i<extra?1:0))}; }
  }
  return best ? best.sizes : [N];
}
function setupMatch(){
  // a lone verb among other kinds of words gives itself away, so bring in one more verb
  if(S.items.filter(w=>w.p==="verb").length===1){
    const have=new Set(S.items.map(w=>w.id)), all=W.filter(w=>w.p==="verb" && !have.has(w.id)), mine=all.filter(w=>sel.has(w.lesson));
    const pick=shuffle(mine.length?mine:all)[0];
    if(pick){ const it=pairUp(pick); S.items.push(it); S.lk.set(it.id,it); }
  }
  const sizes=roundSizes(S.items), R=sizes.length, rounds=Array.from({length:R},()=>[]);
  let P=S.items.filter(w=>w.pair), V=S.items.filter(w=>w.p==="verb"), O=S.items.filter(w=>!w.pair && w.p!=="verb");
  // a lone preposition phrase would stand out too, so show it on its own instead
  if(P.length===1){ const bare=P[0].pair.prep; S.items=S.items.map(w=>w===P[0]?bare:w); S.lk.set(bare.id,bare); O=O.concat(bare); P=[]; }
  const free=r=>sizes[r]-rounds[r].length;
  const place=group=>{                                               // put a kind of word into rounds in groups of two or more
    if(group.length<2){ O=O.concat(group); return; }
    const order=[...Array(R).keys()].sort((a,b)=>free(b)-free(a)||Math.random()-.5);
    const chosen=order.filter(r=>free(r)>=2).slice(0,Math.min(R,Math.floor(group.length/2)));
    if(!chosen.length){ O=O.concat(group); return; }
    const cnt=chosen.map(()=>2); let rest=group.length-2*chosen.length, guard=0;
    while(rest>0 && guard++<1000){ for(let i=0;i<chosen.length&&rest>0;i++){ if(cnt[i]<free(chosen[i])){ cnt[i]++; rest--; } } if(chosen.every((r,i)=>cnt[i]>=free(r))) break; }
    let gi=0; chosen.forEach((r,i)=>{ for(let k=0;k<cnt[i];k++) rounds[r].push(group[gi++]); });
    O=O.concat(group.slice(gi));
  };
  place(P); place(V);
  O=shuffle(O); let oi=0; for(let r=0;r<R;r++) while(free(r)>0 && oi<O.length) rounds[r].push(O[oi++]);
  S.rounds=shuffle(rounds.filter(r=>r.length)); S.r=0; startRound();
}
function startRound(){
  const ws=S.rounds[S.r];
  S.m={words:ws, left:shuffle(ws.map(w=>w.id)), right:shuffle(ws.map(w=>w.id)), doneL:new Set(), doneR:new Set(), pairs:[], missed:new Set(), before:{}, selL:null, selR:null, flash:null};
}
const lk = id => (S && S.lk && S.lk.get(id)) || byId.get(id);
function matchPair(L, R){
  const m=S.m, wl=lk(L), wr=lk(R);
  if(!wl || !wr || m.doneL.has(L) || m.doneR.has(R) || m.flash) return;
  if(m.before[L]===undefined) m.before[L]=st(L);
  // a meaning shared by two words in the round counts for either of them
  if(L===R || conflict(wl,wr)){
    m.doneL.add(L); m.doneR.add(R); m.pairs.push({L,R}); m.selL=m.selR=null;
    let after=st(L);
    if(!m.missed.has(L)){ const r=record(wl,true,"match"); after=r.after; }
    pushResult(wl, !m.missed.has(L), m.before[L], after);
    render();
  }else{
    if(!m.missed.has(L)){ m.missed.add(L); record(wl,false,"match"); }
    m.flash={L,R}; render();
    setTimeout(()=>{ if(S&&S.m===m){ m.flash=null; m.selL=m.selR=null; render(); } }, 650);
  }
}
function matchClick(side, id){
  const m=S.m; if(m.flash) return;
  if(side==="L"){ if(m.doneL.has(id)) return; m.selL = (m.selL===id?null:id); }
  else          { if(m.doneR.has(id)) return; m.selR = (m.selR===id?null:id); }
  if(m.selL && m.selR) matchPair(m.selL, m.selR); else render();
}

/* mc + written */
function answerMC(i){
  if(S.fb) return;
  const w=S.items[S.idx], pick=S.choices[i]; if(!pick) return;
  const ok = ck(pick)===ck(w), before=st(w.id), r=record(w,ok,"mc");
  S.fb={ok, pickedId:ck(pick), before, after:r.after, p:r.p, word:w};
  pushResult(w, ok, before, r.after); render();
}
function submitWritten(){
  if(S.fb) return;
  const input=document.getElementById("ans"); const w=S.items[S.idx];
  const g=grade(input.value, w); if(g.empty){ input.focus(); return; }
  const before=st(w.id), snap=progress.w[w.id]?Object.assign({},progress.w[w.id]):null;
  const r=record(w,g.ok,"write");
  S.fb={ok:g.ok, fuzzy:g.fuzzy||g.loose, typed:input.value.trim(), before, after:r.after, p:r.p, word:w, snap};
  pushResult(w,g.ok,before,r.after); render();
}
function passWritten(){
  if(S.fb) return;
  const w=S.items[S.idx], cur=st(w.id), p=rec(w.id).p;
  S.fb={pass:true, ok:false, before:cur, after:cur, p, word:w};
  pushResult(w,false,cur,cur,true); render();
}
function markNotCorrect(){
  const f=S.fb; if(!f || !f.ok || f.pass) return;
  undoRecord(f.word, f.snap);
  const r=record(f.word,false,"write");
  f.ok=false; f.marked=true; f.fuzzy=false; f.override=false; f.after=r.after; f.p=r.p;
  const last=S.results[S.results.length-1]; last.ok=false; last.after=r.after;
  render();
}
function overrideCorrect(){
  const f=S.fb; if(!f||f.ok) return;
  undoRecord(f.word, f.snap);
  const r=record(f.word,true,"write");
  f.ok=true; f.override=true; f.marked=false; f.after=r.after; f.p=r.p;
  const last=S.results[S.results.length-1]; last.ok=true; last.after=r.after;
  render();
}
function flashMove(d){
  if(d>0 && S.idx>=S.items.length-1){ S.done=true; S.flipped=false; render(); return; }
  S.idx=Math.max(0,Math.min(S.items.length-1,S.idx+d)); S.flipped=false; render();
}
function nextItem(){
  if(S.mode==="ends"){ S.idx++; if(S.idx>=S.items.length){ finish(); return; } loadChart(); render(); return; }
  S.fb=null; S.idx++;
  if(S.idx>=S.items.length){ finish(); return; }
  if(S.mode==="mc"||S.mode==="mce") S.choices=makeChoices(S.items[S.idx], S.mode);
  render();
}
function nextRound(){
  S.r++; if(S.r>=S.rounds.length){ finish(); return; } startRound(); render();
}
function finish(){ screen="results"; clearTimeout(saveTimer); flush(); render(); }
function exitSession(){ if(S && S.results.length){ finish(); } else { screen="home"; S=null; render(); } }

function topbar(done, total, extra){

    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${total?done/total*100:0}%"></i></div>
    <span class="count">${extra}</span></div>`;
}
function reportHtml(f){
  const what = f.word.form ? "this form" : f.word.pair ? "this phrase" : "this word";
  if(f.mnem) return mnemHtml(f);
  if(f.reported) return `<div class="small muted report">${f.reported==="local" ? "Noted on this device only (not signed in), so it was not saved." : f.reported==="inbox" ? "Reported. Thank you, Charlie will see it." : "Reported. Thank you, this has been saved for Claude to check."}</div>`;
  if(f.reporting) return `<form class="report" data-act="reportform"><label class="small muted" for="rnote">What looks wrong with ${what}? (optional)</label>
    <input id="rnote" type="text" autocomplete="off" placeholder="e.g. accent, ending, English"><div class="row"><button class="btn small primary" type="submit">Send report</button><button class="btn small" type="button" data-act="reportcancel">Cancel</button></div></form>`;
  return `<div class="report quiet"><span class="row" style="gap:4px 16px;justify-content:flex-end"><button class="report-btn" data-act="mnem">Propose a better mnemonic</button><button class="report-btn" data-act="report" aria-label="Report a problem with ${what}">Report a problem</button></span></div>`;
}
/* proposing a better mnemonic: the app has no mail server, so it opens the student's own email app with the message filled in */
const MNEM_TO = "";
const mnemWord = w => w.form ? w.base : w.pair ? w.pair.prep : w;
function mnemHtml(f){
  const w=mnemWord(f.word), m=f.mnem;
  if(m.sent && m.inbox) return `<div class="report small"><span role="status">${m.inbox==="sending" ? "Sending…" : m.inbox==="sent" ? "Sent to Charlie. Thank you!" : "It could not be sent. Copy this and send it to Charlie:"}</span>
    ${m.inbox==="failed" ? `<textarea class="mntext" readonly rows="7" aria-label="Message to send">${esc(m.body)}</textarea>` : ""}<div class="row"><button class="btn small" type="button" data-act="mnemdone">Done</button></div></div>`;
  if(m.sent) return `<div class="report small"><span>Your email app should open with the message ready to send. If it didn't, copy this into an email to <b>${esc(MNEM_TO)}</b>:</span>
    <textarea class="mntext" readonly rows="7" aria-label="Message to send">${esc(m.body)}</textarea><div class="row"><button class="btn small" type="button" data-act="mnemdone">Done</button></div></div>`;
  let name=""; try{ name=localStorage.getItem("croyvocab:name")||""; }catch(e){}
  return `<form class="report mnform" data-act="mnemform"><div class="small muted">Propose a better mnemonic for</div>
    <div class="ans"><span class="grk">${esc(w.g)}</span>${tagFor(w)} = ${esc(w.e)}</div>${w.m?`<div class="small muted">Now: ${em(w.m)}</div>`:""}
    <label class="small muted" for="mntext">Your mnemonic</label><textarea id="mntext" rows="3"></textarea>
    <label class="small muted" for="mnname">Your name</label><input id="mnname" type="text" autocomplete="name" value="${esc(name)}">
    <div class="row"><button class="btn small primary" type="submit">Send the mnemonic</button><button class="btn small" type="button" data-act="mnemcancel">Cancel</button></div></form>`;
}
function sendMnem(){
  const f=S&&S.fb; if(!f) return;
  const t=document.getElementById("mntext"), n=document.getElementById("mnname");
  const text=t?t.value.trim():"", name=n?n.value.trim():"";
  if(!text){ t.focus(); return; } if(!name){ n.focus(); return; }
  try{ localStorage.setItem("croyvocab:name", name); }catch(e){}
  const w=mnemWord(f.word);
  const body="Word: "+w.g+(w.c?" ("+w.c+")":"")+" = "+w.e+" (Lesson "+w.lesson+")\nCurrent mnemonic: "+(String(w.m||"").replace(/\*/g,"")||"(none)")+"\n\nProposed mnemonic: "+text+"\n\nFrom: "+name;
  savedName=name;
  if(cap.db && cap.db.inbox){
    f.mnem={sent:true, body, inbox:"sending"}; render();
    cap.db.inbox({kind:"mnemonic", id:w.id, shown:w.g, expected:w.e, note:text, name:name})
      .then(()=>{ f.mnem.inbox="sent"; render(); }, ()=>{ f.mnem.inbox="failed"; render(); });
    return;
  }
  f.mnem={sent:true, body}; render();
  const a=document.createElement("a"); a.href="mailto:"+MNEM_TO+"?subject="+encodeURIComponent("Better mnemonic for "+w.g)+"&body="+encodeURIComponent(body);
  a.target="_blank"; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
}
function feedbackHtml(f, showOverride){
  const w=f.word;
  const p = typeof f.p==="number" ? f.p : P_OF[f.after], left = TOP-p;
  const streak = f.after==="n" ? "not answered correctly yet"
    : f.after==="w" ? `${STRONG_AT-p} more correct answer${STRONG_AT-p===1?"":"s"} to reach strong`
    : f.after==="s" ? `<em>Type it correctly ${left===1?"one more time":left+" more times"} on the written test to make it <b class="lw"><i class="dot l"></i>learned</b>.</em>` : "";
  const move = (f.before!==f.after ? `${statChip(f.before)} → ${statChip(f.after)}` : statChip(f.after)) + ladder(p);
  const verdict = f.pass ? "Passed. No change to this word." : f.ok ? (f.override ? "Marked correct" : f.fuzzy ? "Correct (close enough)" : "Correct") : (f.marked ? "Marked not correct" : "Not quite");
  return `<div class="fb ${f.pass?"skip":f.ok?"ok":"no"}" role="status">
    <div class="verdict">${verdict}</div>
    <div class="ans"><span class="grk">${esc(w.g)}</span>${tagFor(w)} = ${esc(w.e)}${phHtml(w.ph)}</div>
    ${w.form ? `<div class="small">You saw the <b>${esc(formLabel(w))}</b> of <span class="grk">${esc(w.base.g)}</span>. The form in your vocab list is <span class="grk">${esc(w.base.g)}</span>${w.base.ph?` <span class="muted">(${esc(w.base.ph)})</span>`:""} = ${esc(clean(w.base.e))}.</div>` : ""}
    ${w.sh ? `<div class="small"><span class="grk">${esc(w.g)}</span> is spelled the same for the ${esc(PERSON_LABEL[w.sh.opn])}: <b>${esc(w.sh.oe)}</b>. Either meaning counts as correct on the written test.</div>` : ""}
    ${w.pair ? `<div class="small muted">The preposition alone: <span class="grk">${esc(w.pair.prep.g)}</span>${tagFor(w.pair.prep)} = ${esc(clean(w.pair.prep.e))}</div>` : ""}
    ${f.ok && f.fuzzy ? `<div class="small">You typed "${esc(f.typed)}", which I accepted as close enough to the meaning. If it was not what you meant, mark it not correct.</div>` : ""}
    ${w.m ? `<div class="mnem">${em(w.m)}</div>` : ""}
    <div class="row"><span>${move}</span>${streak?`<span class="small muted">${streak}</span>`:""}</div>
    <div class="row">${showOverride && !f.ok && !f.pass ? `<button class="btn" data-act="override">Mark it correct</button>`:""}${showOverride && f.ok ? `<button class="btn" data-act="notcorrect">Mark not correct</button>`:""}<button class="btn primary" data-act="next" id="nextbtn">Next</button></div>
    ${reportHtml(f)}
  </div>`;
}
