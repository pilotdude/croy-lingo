function renderEnds(){
  const it=S.items[S.idx], c=S.cur, total=S.items.length, w=it.w;
  const used=new Set(PERSONS.map(p=>c.slots[p]).filter(v=>v!==null));
  const bank=c.tiles.filter(t=>!used.has(t.id));
  const cell=p=>{
    const tid=c.slots[p], t=tid===null?null:tileBy(tid), exp=it.cells[p];
    let cls="ecell"+(t?" filled":""); if(c.checked) cls+=c.ok[p]?" right":" wrong"; else if(c.sel!==null) cls+=" target";
    let inner = t ? `<span class="grk">${esc(t.g)}</span>` : `<span class="small muted">${c.sel!==null?"place here":"empty"}</span>`;
    if(c.checked){
      if(!c.ok[p]) inner += `<span class="eans">should be <span class="grk">${esc(exp.g)}</span></span>`;
      inner += `<span class="een muted">${esc(clean(exp.e))}</span>`;
    }
    return `<button class="${cls}" data-act="ecell" data-p="${p}" ${c.checked?"disabled":""} aria-label="${PERSON_LABEL[p]}: ${t?esc(t.g):"empty"}">${inner}</button>`;
  };
  const chart=`<div class="echart" role="group" aria-label="Verb chart"><span></span><span class="ehead">Singular</span><span class="ehead">Plural</span>
    ${CHART_ROWS.map((r,i)=>`<span class="erow">${ROW_LABEL[i]}</span>${cell(r[0])}${cell(r[1])}`).join("")}</div>`;
  const n=PERSONS.filter(p=>c.ok[p]).length, last=S.idx===total-1;
  const foot = c.checked
    ? `<div class="fb ${n===6?"ok":"no"}" role="status"><div class="verdict">${n===6?"All six correct":n+" of 6 correct"}</div>
        ${w.m?`<div class="mnem">${em(w.m)}</div>`:""}
        <div class="row"><button class="btn primary" data-act="next" id="nextbtn">${last?"See results":"Next chart"}</button></div></div>`
    : `<div class="bank" role="group" aria-label="Forms to place">${bank.length?bank.map(t=>`<button class="etile ${c.sel===t.id?"sel":""}" data-act="etile" data-id="${t.id}" aria-pressed="${c.sel===t.id}">${esc(t.g)}</button>`).join(""):`<span class="small muted">All six placed. Check when you're ready.</span>`}</div>
       <div class="row"><button class="btn primary" data-act="echeck">Check</button><button class="btn" data-act="eclear">Clear</button></div>`;
  $app.innerHTML=`${topbar(S.idx+(c.checked?1:0), total, `${S.idx+1} of ${total}`)}
  <div class="card t-ends"><div class="prompt"><span class="hint">Place the six forms of</span>
      <div class="big"><span class="grk">${esc(w.g)}</span>${tagFor(w)}</div>
      <div class="etense">${esc(it.tn.charAt(0).toUpperCase()+it.tn.slice(1))}</div>
      <div class="small muted">${esc(clean(w.e))}</div>${c.checked?"":`<span class="hint">Tap a form, then tap its place in the chart. Tap a placed form to take it back.</span>`}</div>
    ${chart}${foot}</div>`;
  if(c.checked){ const b=document.getElementById("nextbtn"); if(b) b.focus(); }
}
function staticChart(it){
  const cell=p=>`<div class="ecell"><span class="grk">${esc(it.cells[p].g)}</span></div>`;
  return `<div class="echart static"><span></span><span class="ehead">Singular</span><span class="ehead">Plural</span>${CHART_ROWS.map((r,i)=>`<span class="erow">${ROW_LABEL[i]}</span>${cell(r[0])}${cell(r[1])}`).join("")}</div>`;
}
function renderEndsResults(){
  const R=S.results, perfect=R.filter(r=>r.ok).length, cells=R.reduce((a,r)=>a+r.n,0), miss=R.filter(r=>!r.ok);
  const review=miss.map(r=>{ const it=S.items.find(x=>x.w.id===r.id && x.t===r.t); return it ? `<div class="miss"><div><span class="g">${esc(r.w.g)}</span>${tagFor(r.w)} <span class="muted">${esc(clean(r.w.e))} · ${esc(r.tn)}</span> <span class="small muted">(${r.n} of 6)</span></div>${staticChart(it)}</div>` : ""; }).join("");
  $app.innerHTML=`<header class="row between"><h1>Results</h1></header>
  <section class="panel"><div class="res-score">${perfect}<span class="muted"> / ${R.length}</span></div>
    <p>${perfect===1?"chart":"charts"} completed perfectly. ${cells} of ${R.length*6} forms were in the right place. Verb Endings does not change Mastery.</p>
    <div class="row"><button class="btn primary" data-act="again">New session</button>${miss.length?`<button class="btn" data-act="retry">Retry missed charts (${miss.length})</button>`:""}<button class="btn ghost" data-act="home">Back to lessons</button></div></section>
  <section class="panel"><h2>Charts to review</h2>${review || `<p>No misses. Nice work.</p>`}</section>`;
}
function renderDrill(){
  if(S.mode==="ends") return renderEnds();
  if(S.mode==="flash") return renderFlash();
  if(S.mode==="match") return renderMatch();
  const w=S.items[S.idx], total=S.items.length, f=S.fb;
  let body="";
  if(S.mode==="mce"){
    body=`<div class="prompt"><span class="hint">What does this Greek mean?</span><div class="big">${esc(w.g)}${tagFor(w)}</div></div>
    <div class="choices" role="group" aria-label="Choices">${S.choices.map((c,i)=>{
      let cls=""; if(f){ if(ck(c)===ck(w)) cls="right"; else if(ck(c)===f.pickedId) cls="wrong"; }
      return `<button class="choice ${cls}" data-act="pick" data-i="${i}" ${f?"disabled":""}><span class="n">${i+1}</span><span class="g en">${esc(c.e)}</span></button>`;}).join("")}</div>`;
  }else if(S.mode==="mc"){
    const easy = st(w.id)!=="s";
    body=`<div class="prompt"><span class="hint">Which Greek word means</span><div class="bigen">${esc(w.e)}</div></div>
    <div class="choices" role="group" aria-label="Choices">${S.choices.map((c,i)=>{
      let cls=""; if(f){ if(ck(c)===ck(w)) cls="right"; else if(ck(c)===f.pickedId) cls="wrong"; }
      return `<button class="choice ${cls}" data-act="pick" data-i="${i}" ${f?"disabled":""}><span class="n">${i+1}</span><span class="g">${esc(c.g)}${tagFor(c)}</span></button>`;}).join("")}</div>`;
  }else{
    body=`<div class="prompt"><span class="hint">Type the English</span><div class="big">${esc(w.g)}${tagFor(w)}</div></div>
    <form class="answer" data-act="submit" autocomplete="off"><input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="English meaning" aria-label="English meaning" ${f?`value="${esc(f.typed)}" readonly`:""}>
      ${f?"":`<button class="btn primary" type="submit">Check</button><button class="btn" type="button" data-act="pass">Pass</button>`}</form>`;
  }
  $app.innerHTML=`${topbar(S.idx+(f?1:0), total, `${Math.min(S.idx+1,total)} of ${total}`)}
  <div class="card ${S.mode==="write"?"t-write":"t-mc"}">${body}${f?feedbackHtml(f, S.mode==="write"):""}</div>`;
  if(S.mode==="write" && !f){ const i=document.getElementById("ans"); if(i) i.focus(); }
  if(f){ const b=document.getElementById("nextbtn"); if(b) b.focus(); }
}

function renderMatch(){
  const m=S.m, total=S.items.length, doneAll=m.doneL.size===m.words.length;
  const doneSoFar = S.results.length;
  const fl = (side,id)=> m.flash && ((side==="L"&&m.flash.L===id)||(side==="R"&&m.flash.R===id));
  const greek = id=>{
    const w=lk(id), sel_=m.selL===id;
    return `<button class="pbtn g ${sel_?"sel":""} ${fl("L",id)?"flash":""}" data-act="mL" data-id="${esc(id)}" aria-pressed="${sel_}">${esc(w.g)}${tagFor(w)}</button>`;
  };
  const english = id=>{
    const w=lk(id), sel_=m.selR===id;
    return `<button class="pbtn ${sel_?"sel":""} ${fl("R",id)?"flash":""}" data-act="mR" data-id="${esc(id)}" aria-pressed="${sel_}">${esc(w.e)}</button>`;
  };
  const lastRound = S.r===S.rounds.length-1;
  const leftIds = m.left.filter(id=>!m.doneL.has(id)), rightIds = m.right.filter(id=>!m.doneR.has(id));
  const cmRows = m.pairs.length ? m.pairs.map(p=>{ const a=lk(p.L), b=lk(p.R);
    return `<div class="cm-row"><span class="g">${esc(a.g)}</span>${tagFor(a)}<span>= ${esc(b.e)}</span>${formNote(a)}</div>`; }).join("")
    : `<p class="empty">Pairs you get right will appear here.</p>`;
  $app.innerHTML=`${topbar(doneSoFar, total, `Round ${S.r+1} of ${S.rounds.length} · ${m.words.length} pairs`)}
  <div class="card t-match"><div class="prompt"><span class="hint">Tap a Greek word, then tap its English meaning.</span></div>
    ${doneAll ? "" : `<div class="pair"><div class="col" aria-label="Greek words">${leftIds.map(greek).join("")}</div><div class="col" aria-label="English meanings">${rightIds.map(english).join("")}</div></div>`}
    ${doneAll ? `<div class="fb ok" role="status"><div class="verdict">Round complete</div>
       <div class="small">${m.words.filter(w=>!m.missed.has(w.id)).length} of ${m.words.length} matched on the first try.</div>
       ${m.words.map(w=>`<div class="small"><span class="grk">${esc(w.g)}</span>${tagFor(w)}${formNote(w)}: ${em(w.m)}</div>`).join("")}
       <div class="row"><button class="btn primary" data-act="nextround" id="nextbtn">${lastRound?"See results":"Next round"}</button></div></div>` : ""}
  </div>
  <section class="panel" aria-labelledby="h-cm"><h2 id="h-cm">Correct matches</h2><div>${cmRows}</div></section>`;
  if(doneAll){ const b=document.getElementById("nextbtn"); if(b) b.focus(); }
}

function renderResults(){
  if(S.mode==="ends") return renderEndsResults();
  const R=S.results, tried=R.filter(r=>!r.pass), passed=R.filter(r=>r.pass), ok=tried.filter(r=>r.ok).length, miss=tried.filter(r=>!r.ok);
  const up=R.filter(r=>RANK[r.after]>RANK[r.before]);
  const down=R.filter(r=>RANK[r.after]<RANK[r.before]);
  const nameOf=id=>{const w=lk(id); return w?`<span class="grk">${esc(w.g)}</span>${tagFor(w)}`:esc(id);};
  const rowHtml = r=>{const w=r.w||lk(r.id); return w?`<div class="miss"><div><span class="g">${esc(w.g)}</span>${tagFor(w)} = ${esc(w.e)}${formNote(w)}${phHtml(w.ph)}</div><div class="mnem small">${em(w.m)}</div></div>`:"";};
  const net = new Map();                                       // net change per word over the whole session: first "before" to last "after"
  R.forEach(r=>{ const n=net.get(r.id); if(n) n.after=r.after; else net.set(r.id,{id:r.id,before:r.before,after:r.after,w:r.w}); });
  const moved = [...net.values()].filter(n=>n.before!==n.after && lk(n.id));
  const chRow = n=>{ const w=n.w||lk(n.id), dir=RANK[n.after]>RANK[n.before]?"up":"down";
    return `<div class="chg ${dir}"><span class="arr" aria-label="${dir==="up"?"moved up":"moved down"}">${dir==="up"?"▲":"▼"}</span><div class="cw"><span class="g">${esc(w.g)}</span>${tagFor(w)}${formNote(w)} <span class="muted">= ${esc(clean(w.e))}</span></div><div class="cs">${statChip(n.before)} → ${statChip(n.after)}</div></div>`; };
  const ups = moved.filter(n=>RANK[n.after]>RANK[n.before]), downs = moved.filter(n=>RANK[n.after]<RANK[n.before]);
  const changeHtml = `<section class="panel"><h2>Mastery changes</h2>${moved.length ? (ups.length?`<h3>Moved up (${ups.length})</h3>${ups.map(chRow).join("")}`:"")+(downs.length?`<h3 style="margin-top:10px">Moved down (${downs.length})</h3>${downs.map(chRow).join("")}`:"") : `<p class="muted">No word changed level this time.</p>`}</section>`;
  const missHtml = (miss.length ? miss.map(rowHtml).join("") : (passed.length ? "" : `<p>No misses. Nice work.</p>`))
    + (passed.length ? `<h3 style="margin-top:10px">Passed</h3>` + passed.map(rowHtml).join("") : "");
  $app.innerHTML=`<header class="row between"><h1>Results</h1><span class="savestate" id="savestate" role="status"></span></header>
  <section class="panel"><div class="res-score">${ok}<span class="muted"> / ${tried.length}</span></div>
    <p>${up.length ? `${up.length} word${up.length===1?"":"s"} moved up. ` : ""}${down.length ? `${down.length} moved down. ` : ""}${passed.length ? `${passed.length} passed. ` : ""}${!up.length&&!down.length?"No mastery changes this time.":""}</p>
    <div class="row"><button class="btn primary" data-act="again">New session</button>${(miss.length+passed.length)?`<button class="btn" data-act="retry">Retry missed${passed.length?" and passed":""} (${miss.length+passed.length})</button>`:""}<button class="btn ghost" data-act="home">Back to lessons</button></div></section>
  <section class="panel"><h2>Words to review</h2>${missHtml}</section>
  ${changeHtml}`;
  paintSave();
}

/* ---------- export / import progress ---------- */
let xferMsg="", xferPending=null;
const XAPP="croy-greek-vocab";
function exportData(){
  const w={}; for(const id of Object.keys(progress.w)){ const r=progress.w[id]; if(!r) continue; if(r.q!==2) fixP(r); const x=byId.get(id); w[id]=Object.assign({g:x?x.g:undefined}, r); }
  return {app:XAPP, format:1, exported:new Date().toISOString(),
    note:"Mastery per word. Key = lesson:first Greek form. s = level (n Unlearned, w Weak, s Strong, l Learned), p = step 0-6. Other fields: c correct, x missed, q = ladder version.",
    progress:{v:1, w:w, prefs:Object.assign({}, progress.prefs, {sel:Array.from(sel).sort((a,b)=>a-b)})}};
}
async function doExport(){
  const text=JSON.stringify(exportData(),null,2), name="croy-greek-progress-"+new Date().toISOString().slice(0,10)+".json";
  let done=false;
  try{ const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if(dl){ await dl.save({filename:name, data:text}); done=true; xferMsg="Progress exported."; } }catch(e){ xferMsg="Export cancelled."; done=true; }
  if(!done){ try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); xferMsg="Progress exported."; }catch(e){ xferMsg="Export is not available here."; } }
  render();
}
function cleanProgress(d){
  if(!d || d.app!==XAPP || !d.progress || typeof d.progress.w!=="object" || d.progress.w===null) return null;
  const w={}, n=v=>Number.isFinite(+v)?+v:0; let count=0;
  for(const id of Object.keys(d.progress.w)){ const r=d.progress.w[id]; if(!r||typeof r!=="object"||!(r.s in P_OF)) continue;
    const o={s:r.s,p:n(r.p),c:n(r.c),x:n(r.x),q:r.q===2?2:(r.p===undefined?undefined:r.q)}; if(r.k!==undefined)o.k=n(r.k); if(r.z!==undefined)o.z=n(r.z); if(o.q===undefined)delete o.q; w[id]=o; count++; }
  return {w:w, prefs:(d.progress.prefs&&typeof d.progress.prefs==="object")?d.progress.prefs:{}, count:count, exported:d.exported||""};
}
function readImport(file){
  const fr=new FileReader();
  fr.onload=()=>{ let d=null; try{ d=JSON.parse(String(fr.result)); }catch(e){}
    const c=cleanProgress(d);
    if(!c||!c.count){ xferPending=null; xferMsg="That file is not a progress export from this trainer, so nothing was changed."; }
    else { xferPending=c; xferMsg=""; }
    render(); };
  fr.onerror=()=>{ xferMsg="Could not read that file."; render(); };
  fr.readAsText(file);
}
function xferStatus(){
  return xferPending ? (xferPending.confirmReplace
    ? `<span class="xmsg">This erases all your progress here and puts the file's in its place. <button data-act="import-replace-yes"><b>Yes, replace everything</b></button> <button data-act="import-no">Cancel</button></span>`
    : !hasProgress()
    ? `<span class="xmsg">Import the progress in the file${xferPending.exported?" saved "+esc(String(xferPending.exported).slice(0,10)):""} (${xferPending.count} word${xferPending.count===1?"":"s"})? <button data-act="import-yes"><b>Yes, import</b></button> <button data-act="import-no">Cancel</button></span>`
    : `<span class="xmsg">Add the progress in the file${xferPending.exported?" saved "+esc(String(xferPending.exported).slice(0,10)):""} (${xferPending.count} word${xferPending.count===1?"":"s"}) to yours? For each word the higher level is kept. <button data-act="import-yes"><b>Yes, merge</b></button> <button data-act="import-replace">Replace all my progress with this file</button> <button data-act="import-no">Cancel</button></span>`)
    : xferMsg ? `<span class="xmsg muted" role="status">${esc(xferMsg)}</span>` : "";
}
const hasProgress = () => Object.keys(progress.w).some(id=>{ const r=progress.w[id]; return r && (r.p>0 || r.c>0 || r.x>0 || (r.s && r.s!=="n")); });
// Merge (the default): per word keep the record that is further up the ladder; on a tie, the one with more correct answers.
// Counts come from the winning record and are never added together, because both copies may hold the same practice.
function mergeProgress(mine, theirs){
  const out={}, q2 = r => { const x=Object.assign({}, r); if(x.q!==2) fixP(x); return x; };
  let fromFile=0, kept=0;
  for(const id of Object.keys(mine)) if(mine[id]) out[id]=q2(mine[id]);
  for(const id of Object.keys(theirs)){
    const t=q2(theirs[id]), m=out[id];
    if(!m || t.p>m.p || (t.p===m.p && t.c>m.c)){ out[id]=t; fromFile++; }
  }
  kept=Object.keys(out).length-fromFile;
  return {w:out, fromFile, kept};
}
function applyImport(how){
  const c=xferPending; if(!c) return;
  const fresh=!hasProgress(), valid=new Set(lessons.filter(L=>(L.words||[]).length).map(L=>L.n));
  if(how==="replace" || fresh){
    progress.w=c.w;
    const keep=Object.assign({sel:null,n:10,lo:0,hi:3,pair:true,vforms:true,verbsOnly:false,tenses:[],pnFocus:false}, c.prefs); delete keep.focus;
    progress.prefs=keep;
    sel=new Set((keep.sel||Array.from(valid)).filter(n=>valid.has(n)));
    xferMsg = how==="replace" ? "Progress replaced with the file ("+c.count+" words)." : "Progress imported ("+c.count+" words).";
  }else{
    const m=mergeProgress(progress.w, c.w);                          // this device's settings stay as they are
    progress.w=m.w;
    xferMsg="Progress imported and merged: "+m.fromFile+" word"+(m.fromFile===1?"":"s")+" from the file, "+m.kept+" kept from this device.";
  }
  if(SITE) progress.prefs.onboard="done";
  xferPending=null; dirty=true; queueSave(); render();
}

/* ---------- events ---------- */
$app.addEventListener("change", e=>{ if(e.target && e.target.id==="impfile" && e.target.files && e.target.files[0]) readImport(e.target.files[0]); });
function persistSel(){ dirty=true; queueSave(); }
$app.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return; const a=t.dataset.act;
  if(a==="tog"){ const n=+t.dataset.n; sel.has(n)?sel.delete(n):sel.add(n); persistSel(); render(); }
  else if(a==="all"){ sel=new Set(lessons.filter(L=>(L.words||[]).length).map(L=>L.n)); persistSel(); render(); }
  else if(a==="none"){ sel=new Set(); persistSel(); render(); }
  else if(a==="range"){ const f=+document.getElementById("rf").value, to=+document.getElementById("rt").value; const lo=Math.min(f,to), hi=Math.max(f,to);
    sel=new Set(lessons.filter(L=>(L.words||[]).length&&L.n>=lo&&L.n<=hi).map(L=>L.n)); persistSel(); render(); }
  else if(a==="n"){ progress.prefs.n=+t.dataset.v; persistSel(); render(); }
  else if(a==="vonly"){ progress.prefs.verbsOnly = t.dataset.v==="1"; progress.prefs.pnFocus=false; persistSel(); render(); }
  else if(a==="pnfocus"){ progress.prefs.pnFocus = !progress.prefs.pnFocus; persistSel(); render(); }
  else if(a==="tenseall"){ progress.prefs.tenses=[]; persistSel(); render(); }
  else if(a==="tense"){ const cur=new Set(progress.prefs.tenses||[]); cur.has(t.dataset.v)?cur.delete(t.dataset.v):cur.add(t.dataset.v); progress.prefs.tenses=[...cur]; persistSel(); render(); }
  else if(a==="vforms"){ progress.prefs.vforms = t.dataset.v==="1"; persistSel(); render(); }
  else if(a==="pair"){ progress.prefs.pair = t.dataset.v==="1"; persistSel(); render(); }
  else if(a==="start"){ startSession(t.dataset.mode); }
  else if(a==="reset"){ confirmReset=true; render(); }
  else if(a==="reset-no"){ confirmReset=false; render(); }
  else if(a==="export"){ doExport(); }
  else if(a==="import"){ xferMsg=""; const f=document.getElementById("impfile"); if(f){ f.value=""; f.click(); } }
  else if(a==="import-yes"){ applyImport("merge"); }
  else if(a==="welcome-yes"){ welcomeStep="yes"; render(); }
  else if(a==="signin" && cap.acct){ acctMsg=""; cap.acct.signIn().then(()=>{ acctMsg=""; render(); }, e=>{ acctMsg="Sign-in did not work ("+(e && (e.code||e.message) || "unknown error")+"). Please try again."; render(); }); }
  else if(a==="signout" && cap.acct){ cap.acct.signOut(); }
  else if(a==="welcome-back"){ welcomeStep="ask"; xferPending=null; xferMsg=""; render(); }
  else if(a==="welcome-later"){ welcomeLater=true; xferPending=null; xferMsg=""; render(); }
  else if(a==="welcome-no"){ progress.prefs.onboard="no"; dirty=true; queueSave(); render(); }
  else if(a==="toexport"){ const x=document.querySelector(".xfer"); if(x){ x.scrollIntoView({behavior:"smooth", block:"center"}); const b=x.querySelector('[data-act="export"]'); if(b) b.focus({preventScroll:true}); } }
  else if(a==="import-replace"){ if(xferPending){ xferPending.confirmReplace=true; render(); } }
  else if(a==="import-replace-yes"){ applyImport("replace"); }
  else if(a==="import-no"){ xferPending=null; xferMsg=""; render(); }
  else if(a==="reset-yes"){ W.filter(w=>sel.has(w.lesson)).forEach(w=>{ delete progress.w[w.id]; }); confirmReset=false; queueSave(); render(); }
  else if(a==="exit"){ exitSession(); }
  else if(a==="flip"){ S.flipped=!S.flipped; S.anim=true; render(); }
  else if(a==="fnext"){ flashMove(1); }
  else if(a==="fprev"){ flashMove(-1); }
  else if(a==="fside"){ S.front=t.dataset.v; S.flipped=false; render(); }
  else if(a==="fagain"){ S.idx=0; S.done=false; S.flipped=false; render(); }
  else if(a==="report"){ if(S&&S.fb){ S.fb.reporting=true; render(); const i=document.getElementById("rnote"); if(i) i.focus(); } }
  else if(a==="reportcancel"){ if(S&&S.fb){ S.fb.reporting=false; render(); } }
  else if(a==="mnem"){ if(S&&S.fb){ S.fb.mnem={}; render(); const i=document.getElementById("mntext"); if(i) i.focus(); } }
  else if(a==="mnemcancel"||a==="mnemdone"){ if(S&&S.fb){ S.fb.mnem=null; render(); } }
  else if(a==="pick"){ answerMC(+t.dataset.i); }
  else if(a==="etile"){ endsTile(+t.dataset.id); }
  else if(a==="ecell"){ endsCell(t.dataset.p); }
  else if(a==="echeck"){ endsCheck(); }
  else if(a==="eclear"){ endsClear(); }
  else if(a==="next"){ nextItem(); }
  else if(a==="override"){ overrideCorrect(); }
  else if(a==="notcorrect"){ markNotCorrect(); }
  else if(a==="pass"){ passWritten(); }
  else if(a==="mL"||a==="mR"){ matchClick(a==="mL"?"L":"R", t.dataset.id); }
  else if(a==="nextround"){ nextRound(); }
  else if(a==="again"){ const mode=S.mode; screen="home"; startSession(mode); }
  else if(a==="retry" && S.mode==="ends"){ startEnds(S.results.filter(r=>!r.ok).map(r=>({id:r.id, t:r.t}))); }
  else if(a==="retry"){ const mode=S.mode, ids=S.results.filter(r=>!r.ok).map(r=>r.id); startSession(mode, ids.map(id=>byId.get(id)).filter(Boolean)); }
  else if(a==="home"){ screen="home"; S=null; render(); }
});
$app.addEventListener("input", e=>{
  const t=e.target; if(!t.dataset || (t.dataset.act!=="rlo" && t.dataset.act!=="rhi")) return;
  const A=$app.querySelector('[data-act=rlo]'), B=$app.querySelector('[data-act=rhi]');
  let a=+A.value, b=+B.value;                                   // a = left edge of the first level, b = right edge of the last level (1..4)
  if(a>=b){ if(t.dataset.act==="rlo") a=b-1; else b=a+1; }
  if(a<0) a=0; if(b>4) b=4; if(b<1) b=1; if(a>3) a=3;
  A.value=a; B.value=b;
  progress.prefs.lo=a; progress.prefs.hi=b-1;
  $app.querySelectorAll(".rs-seg").forEach((el,i)=>el.classList.toggle("on", i>=a && i<=b-1));
  const x=document.getElementById("rtxt"); if(x) x.textContent=rangeText();
  const c=document.getElementById("rcnt"); if(c) c.textContent=pool().length+" of "+selWords().length+" selected words";
});
$app.addEventListener("change", e=>{
  const t=e.target; if(!t.dataset) return;
  if(t.dataset.act==="rlo" || t.dataset.act==="rhi"){ persistSel(); render(); return; }
  if(t.dataset.act==="setst"){ setStatus(t.dataset.id, t.value); render(); }
  else if(t.dataset.act==="sortwl"){ listSort=t.value; render(); }
  else if(t.dataset.act==="rf"){ rangeFrom=+t.value; }
  else if(t.dataset.act==="rt"){ rangeTo=+t.value; }
});
$app.addEventListener("toggle", e=>{ if(e.target.id==="wl") listOpen=e.target.open; if(e.target.id==="ps") setOpen=e.target.open; }, true);

document.addEventListener("keydown", e=>{
  if(screen!=="drill" || !S || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.target && e.target.closest && e.target.closest(".report")) return;     // typing a report or a mnemonic
  if(S.mode==="flash"){
    if(S.done) return;
    if(e.key==="ArrowRight"){ flashMove(1); e.preventDefault(); }
    else if(e.key==="ArrowLeft"){ flashMove(-1); e.preventDefault(); }
    else if((e.key===" "||e.key==="Enter") && !(document.activeElement && ["BUTTON"].includes(document.activeElement.tagName) && document.activeElement.dataset.act!=="flip")){ S.flipped=!S.flipped; S.anim=true; render(); e.preventDefault(); }
    return;
  }
  if(S.mode==="mc"||S.mode==="mce"){
    if(!S.fb && /^[1-4]$/.test(e.key)){ answerMC(+e.key-1); e.preventDefault(); }
    else if(S.fb && (e.key==="Enter"||e.key===" ")){ if(document.activeElement && document.activeElement.id==="nextbtn") return; nextItem(); e.preventDefault(); }
  }else if(S.mode==="write" && S.fb && e.key==="Enter"){
    if(document.activeElement && document.activeElement.tagName==="BUTTON") return; nextItem(); e.preventDefault();
  }
});


/* ---------- static-site storage (replaces the Claude database) ---------- */

  const P="croyvocab:";
  const doc = path => ({
    async get(){ let v=null; try{ v=localStorage.getItem(P+path); }catch(e){} return {exists:v!==null, data:()=>v===null?undefined:JSON.parse(v)}; },
    async set(d){ localStorage.setItem(P+path, JSON.stringify(d)); }

  return { doc,
    collection(name){ return { onSnapshot(next, fail){
      fetch("data/lessons/index.json").then(r=>{ if(!r.ok) throw new Error("index"); return r.json(); })

})();

      const here = JSON.parse(JSON.stringify(progress));    // what this device has under the anonymous account
      me = (await A.signInWithCredential(auth, c)).user;
      const r = F.doc(fs, "users", me.uid, "data", "progress"), s = await F.getDoc(r), acc = s.exists() ? s.data() : null;
      const merged = {v: 1, w: acc ? mergeProgress(acc.w || {}, here.w || {}).w : (here.w || {}), prefs: Object.assign({}, here.prefs || {}, (acc && acc.prefs) || {})};
      await F.setDoc(r, JSON.parse(JSON.stringify(merged)));

/* ---------- boot ---------- */
function applyLessons(docs){
  lessons = docs.map(d=>d.data()).filter(d=>d && typeof d.n==="number").sort((a,b)=>a.n-b.n);
  rebuild();
  const valid = new Set(lessons.filter(L=>(L.words||[]).length).map(L=>L.n));
  if(!applyLessons.init){ sel = new Set((progress.prefs.sel||Array.from(valid)).filter(n=>valid.has(n))); applyLessons.init = true; }
  else sel = new Set(Array.from(sel).filter(n=>valid.has(n)));
}
async function boot(){
  render();
  let user=null, db=null;
  try{ const f = await FIREDB.start(); user = f.user; db = f.db; }catch(e){ console.warn("Firebase unavailable, using this browser only", e); user = { id: async()=>"local" }; db = LOCALDB; }
  if(!db){ cap.status="nodb"; render(); return; }
  cap.db = db;
  try{ cap.uid = user ? await user.id() : null; }catch(e){ cap.uid=null; }
  cap.acct = (user && user.account) || null;
  if(cap.uid){
    try{
      const snap = await db.doc("data/users/"+cap.uid+"/progress").get();
      if(snap.exists){ const d=JSON.parse(JSON.stringify(snap.data()||{})); progress.w = d.w || {}; progress.prefs = Object.assign({sel:null,n:10,lo:0,hi:3,pair:true,vforms:true,verbsOnly:false,tenses:[],pnFocus:false}, d.prefs||{}); if(d.prefs && d.prefs.focus==="needs" && d.prefs.lo===undefined){ progress.prefs.lo=0; progress.prefs.hi=1; } delete progress.prefs.focus; }
    }catch(e){}
    try{ const rs = await db.doc("data/users/"+cap.uid+"/reports").get(); if(rs.exists){ const d=JSON.parse(JSON.stringify(rs.data()||{})); reports = Array.isArray(d.items)?d.items:[]; } }catch(e){}
  }
  cap.status="ready"; cap.save = cap.uid ? "idle" : "local";
  db.collection("lessons").onSnapshot(snap=>{
    applyLessons(snap.docs);
    if(screen==="home") render();
    maybeNotice();
  }, ()=>{ if(cap.status!=="ready") return; });
  render();
}
/* ---------- one-time notice: new irregular futures in Lesson 12 (shown once per person, through Tuesday 27 Oct 2026) ---------- */
const NOTICE = {id:"l12-irregular-futures-2026-10-25", until:new Date(2026,9,28).getTime(),
  ids:["12:δυνήσομαι","12:φάγομαι","12:εὑρήσω","12:ἕξω","12:θαυμάσομαι","12:οἴσω"]};
let noticeState="idle", noticeSeen={};
async function maybeNotice(){
  if(noticeState!=="idle" || cap.status!=="ready" || !W.length) return;
  if(Date.now()>=NOTICE.until){ noticeState="done"; return; }
  const items=NOTICE.ids.map(id=>byId.get(id)).filter(Boolean);
  if(items.length<NOTICE.ids.length) return;                       // wait until the new words have loaded
  noticeState="checking";
  let seen=false;
  try{ if(localStorage.getItem("notice:"+NOTICE.id)) seen=true; }catch(e){}
  if(!seen && cap.db && cap.uid){
    try{ const s=await cap.db.doc("data/users/"+cap.uid+"/notices").get();
      if(s.exists){ const d=JSON.parse(JSON.stringify(s.data()||{})); noticeSeen=d.seen||{}; if(noticeSeen[NOTICE.id]) seen=true; } }catch(e){}
  }
  if(seen){ noticeState="done"; return; }
  noticeState="shown"; showNotice(items);
}
function showNotice(items){
  const back=document.createElement("div"); back.className="nt-back";
  const prevFocus=document.activeElement, prevOverflow=document.body.style.overflow;
  back.innerHTML=`<div class="nt" role="dialog" aria-modal="true" aria-labelledby="nt-h" aria-describedby="nt-d">
    <div class="nt-head"><h2 id="nt-h">New in Lesson 12</h2>
      <p id="nt-d">Six irregular future verb forms were added to the Lesson 12 vocabulary.</p></div>
    <div class="nt-list" tabindex="0" aria-label="The six new verb forms">${items.map(w=>`<div class="nt-item"><div class="g">${esc(w.g)}</div><div class="e">${esc(w.e)}</div><div class="m">${em(w.m)}</div></div>`).join("")}</div>
    <div class="nt-foot"><button class="btn primary" type="button" id="nt-ok">Got it</button></div></div>`;
  document.body.appendChild(back); document.body.style.overflow="hidden";
  const ok=back.querySelector("#nt-ok"); ok.focus();
  function close(){
    document.removeEventListener("keydown", onKey, true); back.remove(); document.body.style.overflow=prevOverflow;
    try{ if(prevFocus && prevFocus.focus) prevFocus.focus(); }catch(e){}
    noticeState="done";
    try{ localStorage.setItem("notice:"+NOTICE.id, "1"); }catch(e){}
    if(cap.db && cap.uid){ noticeSeen=Object.assign({}, noticeSeen, {[NOTICE.id]:new Date().toISOString()});
      cap.db.doc("data/users/"+cap.uid+"/notices").set({v:1, seen:noticeSeen}).catch(()=>{}); }
  }
  function onKey(e){
    if(e.key==="Escape"){ e.preventDefault(); close(); }
    else if(e.key==="Tab"){ const f=[back.querySelector(".nt-list"), ok]; const i=f.indexOf(document.activeElement);
      e.preventDefault(); f[(i+(e.shiftKey?-1:1)+f.length)%f.length].focus(); }
  }
  document.addEventListener("keydown", onKey, true);
  ok.addEventListener("click", close);
  back.addEventListener("click", e=>{ if(e.target===back) close(); });
}
boot();
